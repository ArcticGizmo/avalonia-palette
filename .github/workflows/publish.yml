name: Publish to NuGet

# Publishes ArcticGizmo.Avalonia.Palette to nuget.org when you push a version tag
# (e.g. `git tag v0.1.0 && git push origin v0.1.0`). Uses NuGet Trusted Publishing —
# no API key is stored; a short-lived key is minted from a GitHub OIDC token at push time.
#
# One-time nuget.org setup (Account → Trusted Publishing → new policy):
#   Repository Owner : ArcticGizmo
#   Repository       : avalonia-pallete
#   Workflow File    : publish.yml        (file name only, no path)
#   Environment      : (leave empty — this workflow does not use one)
# Then add a repo secret NUGET_USER = your nuget.org profile name (NOT your email).

on:
  push:
    tags: [ 'v*' ]        # v0.1.0, v0.2.0, …
  workflow_dispatch:       # allow manual runs from the Actions tab

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write      # REQUIRED: lets the job mint a GitHub OIDC token
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Fail the release if any palette drops below WCAG AA.
      - name: WCAG contrast gate
        run: dotnet run --project src/Palette.Sample -- --verify

      # Version comes from the tag: v0.1.0 → 0.1.0
      - name: Derive version from tag
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      # Pack every packable project (the UI-free core + the Avalonia engine that depends on it;
      # the sample is IsPackable=false). Packing the solution with one PackageVersion keeps the
      # engine's dependency on the core pinned to the same tag version. The push step globs both.
      - name: Pack
        run: >
          dotnet pack Palette.slnx -c Release -o artifacts
          -p:PackageVersion=${{ steps.ver.outputs.version }}

      # Exchange the OIDC token for a temporary (~1h) nuget.org API key.
      - name: NuGet login (OIDC → short-lived key)
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push package (+ symbols)
        run: >
          dotnet nuget push "artifacts/*.nupkg"
          --api-key ${{ steps.login.outputs.NUGET_API_KEY }}
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate
